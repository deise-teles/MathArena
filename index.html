<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MathArena</title>

  <link
    rel="stylesheet"
    href="styles/style.css"
  />

</head>

<body>

  <!-- HOME -->
  <main class="container" id="home-screen">

    <h1 class="logo">
      MathArena
    </h1>

    <p class="subtitle">
      Teste suas habilidades matemáticas
      e suba no ranking.
    </p>

    <input
      type="text"
      id="player-name"
      placeholder="Digite seu nickname"
    />

    <select id="difficulty">

      <option value="easy">
        Easy
      </option>

      <option value="medium">
        Medium
      </option>

      <option value="hard">
        Hard
      </option>

    </select>

    <button
      class="play-button"
      id="start-game"
    >
      PLAY
    </button>

    <div class="leaderboard">

      <h2>TOP PLAYERS</h2>

      <ul id="ranking-list">

      </ul>

    </div>

  </main>

  <!-- GAME SCREEN -->
  <section
    class="game-screen hidden"
    id="game-screen"
  >

    <div class="top-bar">

      <h2 id="score">
        Score: 0
      </h2>

      <h2 id="streak">
        Streak: 0
      </h2>

      <h2 id="level">
        Level: 1
      </h2>

      <h2 id="timer">
        Time: 30
      </h2>

    </div>

    <div
      class="question-box"
      id="question-box"
    >

      <h1 id="question">
        5 + 8
      </h1>

    </div>

    <div class="answers">

      <button class="answer-btn">
        10
      </button>

      <button class="answer-btn">
        13
      </button>

      <button class="answer-btn">
        15
      </button>

      <button class="answer-btn">
        20
      </button>

    </div>

  </section>

  <!-- GAME OVER -->
  <div
    id="game-over"
    class="hidden"
  >

    <h1>
      GAME OVER
    </h1>

    <p id="final-score">
      Your score: 0
    </p>

    <h2 class="game-over-ranking-title">
      LEADERBOARD
    </h2>

    <ul id="game-over-ranking">

    </ul>

    <button id="restart-button"  class="menu-button">
      Play Again
    </button>

    <button id="home-button"  class="menu-button">
      Home
    </button>

  </div>

  <!-- AUDIO -->
  <audio
    id="correct-sound"
    src="assets/sounds/correct.mp3"
  ></audio>

  <audio
    id="wrong-sound"
    src="assets/sounds/wrong.mp3"
  ></audio>

  <audio
    id="gameover-sound"
    src="assets/sounds/gameover.mp3"
  ></audio>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>

</html>
